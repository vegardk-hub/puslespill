<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Puslespill</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070e">
<meta name="description" content="Puslespill med neonmotiv, laget for iPad.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puslespill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/ikon-180.png">
<link rel="icon" href="./icons/ikon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<canvas id="brett"></canvas>

<header id="panel">
  <div class="rad rad-topp">
    <h1>Puslespill</h1>
    <button id="panel-veksle" class="ikonknapp" aria-label="Vis eller skjul panelet">▾</button>
  </div>

  <div class="panelinnhold">
    <div class="rad">
      <span class="etikett">Brikker</span>
      <div class="chips">
        <button data-forhandsvalg="12">12</button>
        <button data-forhandsvalg="24">24</button>
        <button data-forhandsvalg="50">50</button>
        <button data-forhandsvalg="100">100</button>
        <button data-forhandsvalg="150">150</button>
        <button data-forhandsvalg="200">200</button>
        <button data-forhandsvalg="300">300</button>
        <button data-forhandsvalg="500">500</button>
      </div>
      <input id="eget-antall" type="number" min="4" max="500" step="1" inputmode="numeric"
             aria-label="Eget antall brikker">
    </div>

    <div class="rad resultat">
      <strong id="brikketall">—</strong>
      <span id="alternativer"></span>
    </div>

    <div class="rad">
      <span class="etikett">Motiv</span>
      <select id="motiv" aria-label="Motivtype">
        <option value="tilfeldig">Tilfeldig</option>
      </select>
      <button id="velgbilde">Eget bilde &hellip;</button>
      <input id="bildefil" type="file" accept="image/*" hidden>
    </div>

    <div class="rad galleri" id="minebilder" hidden>
      <span class="etikett">Mine</span>
      <div id="minebilder-liste"></div>
    </div>

    <div class="rad">
      <span class="etikett">Kutt</span>
      <select id="kuttstil" aria-label="Brikkeform">
        <option value="klassisk">Klassisk</option>
        <option value="bolget">Bølget</option>
        <option value="kaotisk">Kaotisk</option>
      </select>

      <span class="etikett">Palett</span>
      <select id="palett" aria-label="Fargepalett">
        <option value="auto">Tilfeldig</option>
      </select>
    </div>

    <div class="rad">
      <span class="etikett">Spøkelse</span>
      <input id="spokelse" type="range" min="0" max="60" value="15" aria-label="Styrke på spøkelsesbilde">
      <button id="fest" aria-pressed="true">Fest til brettet</button>
      <button id="lydknapp" aria-pressed="true">Lyd på</button>
    </div>

    <div class="rad">
      <button id="nytt" class="primar">Nytt motiv</button>
      <button id="stokk">Stokk</button>
      <button id="rydd">Rydd</button>
      <button id="skuffknapp" aria-pressed="true">Skuff</button>
      <button id="fasit">Fasit</button>
      <span id="spillstatus" class="spillstatus">—</span>
    </div>

    <div class="fremdrift"><div id="fremdrift-linje"></div></div>

    <p id="status" class="status">—</p>
  </div>
</header>

<div id="skufflinje">
  <div id="skufffiltre" role="group" aria-label="Sorter brikkene i skuffen"></div>
</div>

<div id="laster" hidden>
  <div class="spinner"></div>
  <p id="laster-tekst">Tegner motiv …</p>
</div>

<div id="beskjaer" hidden>
  <div class="beskjaer-topp">
    <strong>Beskjær bildet</strong>
    <div class="chips" id="beskjaer-format">
      <button data-aspekt="1.5" class="aktiv">Liggende</button>
      <button data-aspekt="1">Kvadrat</button>
      <button data-aspekt="0.6667">Stående</button>
    </div>
  </div>
  <canvas id="beskjaer-lerret"></canvas>
  <div class="beskjaer-bunn">
    <p id="beskjaer-varsel" class="varsel" hidden></p>
    <button id="beskjaer-avbryt">Avbryt</button>
    <button id="beskjaer-ok" class="primar">Bruk bildet</button>
  </div>
</div>

<div id="ferdig" hidden>
  <div class="ferdigkort">
    <div class="ferdigikon">&#9733;</div>
    <h2>Ferdig!</h2>
    <p id="ferdig-tekst"></p>
    <p class="hint">Trykk for å lukke</p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
