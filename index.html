<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Puslespill</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070e">
<meta name="description" content="Puslespill med neonmotiv, laget for iPad.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puslespill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/ikon-180.png">
<link rel="icon" href="./icons/ikon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<canvas id="brett"></canvas>

<!-- Topplinja er alt man trenger mens man pusler. Resten bor i menyen. -->
<header id="topplinje">
  <!-- Tilbake står først og har tekst. Et husikon sier ingenting til et barn. -->
  <button id="hjemknapp" class="tilbakeknapp" aria-label="Tilbake til startskjermen">
    <span class="pil" aria-hidden="true"></span>Tilbake
  </button>

  <div class="fremdriftsfelt">
    <div class="fremdrift"><div id="fremdrift-linje"></div></div>
    <span id="spillstatus" class="spillstatus" aria-live="polite">—</span>
  </div>

  <div class="snarveier">
    <button id="rydd" title="Legg løse brikker i rutenett">Rydd</button>
    <button id="skuffknapp" aria-pressed="true" title="Vis eller skjul brikkeskuffen">Skuff</button>
    <button id="bildeknapp" aria-pressed="false" title="Vis motivet i hjørnet">Bilde</button>
    <button id="menyknapp" class="ikonknapp" aria-label="Åpne innstillinger" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
  </div>
</header>

<!-- Startskjermen: to valg, og ingenting annet. Alt det andre bor bak
     «Flere valg» for den som vil ha det. -->
<div id="start" hidden>
  <div class="start-innhold">
    <h1 class="start-tittel">Puslespill</h1>

    <div id="heltskjerm-hint" class="hint-kort" hidden>
      <b id="hint-tittel">Vil du ha hele skjermen?</b>
      <p id="hint-tekst"></p>
      <div class="hint-knapper">
        <button id="hint-installer" class="primar" hidden>Installer appen</button>
        <button id="heltskjerm-lukk">Skjønner</button>
      </div>
    </div>

    <button id="fortsett" class="fortsettknapp" hidden>
      <b>Fortsett der du slapp</b>
      <span id="fortsett-tekst"></span>
    </button>

    <h2 class="start-sporsmal">Velg et bilde</h2>
    <div id="start-motiv" class="motivrutenett"></div>

    <h2 class="start-sporsmal">Hvor mange brikker?</h2>
    <div id="start-antall" class="antallvalg"></div>

    <button id="start-spill" class="startknapp">Pusle!</button>

    <div class="start-bunn">
      <button id="start-flere">Flere valg</button>
      <button id="start-samling">Samling</button>
    </div>
  </div>
</div>

<div id="menyskygge" hidden></div>

<aside id="meny" hidden aria-label="Innstillinger">
  <div class="meny-topp">
    <h1>Puslespill</h1>
    <button id="meny-lukk" class="ikonknapp" aria-label="Lukk innstillinger">&times;</button>
  </div>

  <div class="meny-innhold">
    <section>
      <h2>Nivå</h2>
      <div class="chips" id="oppsett"></div>
      <p class="rad resultat">
        <strong id="brikketall">—</strong>
        <span id="alternativer"></span>
        <span id="vanskemerke" class="vanskemerke">—</span>
      </p>
    </section>

    <section>
      <h2>Brikker</h2>
      <div class="rad">
        <div class="chips">
          <button data-forhandsvalg="12">12</button>
          <button data-forhandsvalg="24">24</button>
          <button data-forhandsvalg="50">50</button>
          <button data-forhandsvalg="100">100</button>
          <button data-forhandsvalg="150">150</button>
          <button data-forhandsvalg="200">200</button>
          <button data-forhandsvalg="300">300</button>
          <button data-forhandsvalg="500">500</button>
        </div>
        <input id="eget-antall" type="number" min="4" max="500" step="1" inputmode="numeric"
               aria-label="Eget antall brikker">
      </div>
    </section>

    <section>
      <h2>Motiv</h2>
      <div class="rad">
        <select id="motiv" aria-label="Motivtype">
          <option value="tilfeldig">Tilfeldig</option>
        </select>
        <button id="velgbilde">Eget bilde &hellip;</button>
        <input id="bildefil" type="file" accept="image/*" hidden>
      </div>
      <div class="rad galleri" id="minebilder" hidden>
        <div id="minebilder-liste"></div>
      </div>
      <div class="rad">
        <span class="etikett">Kutt</span>
        <select id="kuttstil" aria-label="Brikkeform">
          <option value="klassisk">Klassisk</option>
          <option value="bolget">Bølget</option>
          <option value="kaotisk">Kaotisk</option>
        </select>
        <span class="etikett">Palett</span>
        <select id="palett" aria-label="Fargepalett">
          <option value="auto">Tilfeldig</option>
        </select>
      </div>
    </section>

    <section>
      <h2>Hjelp og utfordring</h2>
      <div class="rad">
        <label class="etikett" for="spokelse">Spøkelsesbilde</label>
        <input id="spokelse" type="range" min="0" max="60" value="15">
      </div>
      <div class="rad">
        <button id="fest" aria-pressed="true">Fest til brettet</button>
        <button id="rotasjon" aria-pressed="false">Roter brikker</button>
        <button id="kanterforst" aria-pressed="false">Kanter først</button>
        <button id="lydknapp" aria-pressed="true">Lyd på</button>
      </div>
      <p id="hjelpetekst" class="hjelpetekst" aria-live="polite"></p>
    </section>

    <section>
      <h2>Spillet</h2>
      <div class="rad">
        <button id="nytt" class="primar">Nytt motiv</button>
        <button id="dagens">Dagens</button>
        <button id="stokk">Stokk om</button>
        <button id="fasit">Fasit</button>
        <button id="samlingknapp">Samling</button>
      </div>
    </section>

    <p id="status" class="status"></p>
  </div>
</aside>

<div id="forhandsvisning" hidden>
  <canvas id="forhandsvisning-lerret"></canvas>
  <button id="forhandsvisning-storre" aria-label="Bytt størrelse">&#8597;</button>
</div>

<div id="skufflinje">
  <div id="skufffiltre" role="group" aria-label="Sorter brikkene i skuffen"></div>
</div>

<div id="samling" hidden>
  <div class="samling-topp">
    <strong>Samlingen</strong>
    <button id="samling-lukk">Lukk</button>
  </div>
  <div id="samling-tall" class="samling-tall"></div>
  <div id="samling-liste" class="samling-liste"></div>
</div>

<div id="beskjaer" hidden>
  <div class="beskjaer-topp">
    <strong>Beskjær bildet</strong>
    <div class="chips" id="beskjaer-format">
      <button data-aspekt="1.5" class="aktiv">Liggende</button>
      <button data-aspekt="1">Kvadrat</button>
      <button data-aspekt="0.6667">Stående</button>
    </div>
  </div>
  <canvas id="beskjaer-lerret"></canvas>
  <div class="beskjaer-bunn">
    <p id="beskjaer-varsel" class="varsel" hidden></p>
    <button id="beskjaer-avbryt">Avbryt</button>
    <button id="beskjaer-ok" class="primar">Bruk bildet</button>
  </div>
</div>

<div id="laster" hidden>
  <div class="spinner"></div>
  <p id="laster-tekst">Tegner motiv …</p>
</div>

<div id="ferdig" hidden>
  <div class="ferdigkort">
    <div class="ferdigikon">&#9733;</div>
    <h2>Ferdig!</h2>
    <p id="ferdig-tekst"></p>
    <div class="rad ferdigvalg">
      <button id="ferdig-nytt" class="primar">Nytt puslespill</button>
      <button id="ferdig-lukk">Se bildet</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
